spring:
  application:
    name: know-engine
  profiles:
    active: local   # 凭据见 application-local.yml（已 gitignore）

  # MySQL（T480s 1Panel-mysql-qEJL, 8.4.7）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:10.244.0.111}:3306/knowstack?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD}

  # Redis（T480s docker-redis-1，需密码）
  data:
    redis:
      host: ${REDIS_HOST:10.244.0.111}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 2

  # Elasticsearch（T480s es-ik:8.19.10，含 IK 分词）
  elasticsearch:
    uris: http://${ES_HOST:10.244.0.111}:9200

  # Neo4j（T480s neo4j:5.22-community）
  neo4j:
    uri: bolt://${NEO4J_HOST:10.244.0.111}:7687
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}

  # 文档上传大小限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO（debian 1Panel-minio-tKMN）
minio:
  endpoint: http://${MINIO_HOST:10.244.0.102}:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: knowstack

# MinerU 4.1.5 自托管 API（Yoga，/v1/tasks 创建任务、上传 PDF/Word、下载 ZIP）
mineru:
  base-url: http://${MINERU_HOST:10.244.0.110}:8000

# Yoga Ollama 视觉模型（生成 Markdown 中图片的描述）
vision:
  base-url: http://${VISION_HOST:10.244.0.110}:11434
  model: qwen3-vl:8b

# XXL-Job（T480s，Admin 与客户端目标版本 2.4.2）
xxl:
  job:
    admin:
      addresses: http://${XXL_JOB_HOST:10.244.0.111}:28080/xxl-job-admin
    executor:
      appname: know-engine
      port: 9999
      ip: ${XXL_JOB_EXECUTOR_IP:} # Admin 可达的执行器地址；多网卡/代理环境需显式指定
    accessToken: default_token

# Yoga Ollama（1024 维；现有 1536 维 ES 索引需重建后才能写入）
embedding:
  base-url: http://${EMBEDDING_HOST:10.244.0.110}:11434
  model: qwen3-embedding:4b
  dimensions: 1024

# 向量库（复用 spring.elasticsearch.uris，索引按 embedding.dimensions 自动建 mapping）
vector-store:
  index: knowstack_chunks

# DeepSeek OpenAI 兼容 API
deepseek:
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat
  api-key: ${DEEPSEEK_API_KEY}
